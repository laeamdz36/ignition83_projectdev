name: ubu_ign8_3_cicd

services:
  # Ignition Gateway
  gateway:
    build:
      context: .
      dockerfile: dockerfile.ignGit
    # image: inductiveautomation/ignition:8.3-nightly
    container_name: DEV_IgnitionSTD83_CICD
    restart: no
    ports:
      # <port_host>:<port_contenedor>
      - 5088:8088
      - 5043:8043
    networks:
      - ot-network-cicd
    volumes:
      - ./services/ignition/config:/usr/local/bin/ignition/data/config:rw
      - ./services/ignition/projects:/usr/local/bin/ignition/data/projects:rw
    env_file:
      - .env
    command: >
      -n ign-STD83CICD_01 -m 2048 -- wrapper.java.initmemory=512 -Dignition.allowunsignedmodules=true

networks:
  ot-network-cicd:
